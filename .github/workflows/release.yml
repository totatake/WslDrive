name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify release tag matches project version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          [xml]$csproj = Get-Content src/WslMountDrive.App/WslMountDrive.App.csproj
          $ver = $csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($tag -ne $ver) {
            Write-Error "Git tag '$tag' does not match WslMountDrive.App.csproj Version '$ver'."
            exit 1
          }

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and test (Release)
        run: |
          dotnet build WslMountDrive.sln -c Release
          dotnet test WslMountDrive.sln -c Release --no-build

      - name: Publish framework-dependent binaries (win-x64)
        shell: pwsh
        run: |
          $pkgName = "WslMountDrive-${{ github.ref_name }}-win-x64"
          $zipName = "$pkgName.zip"
          dotnet publish src/WslMountDrive.App/WslMountDrive.App.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o "publish/$pkgName"
          dotnet publish src/WslMountDrive.Cli/WslMountDrive.Cli.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o "publish/$pkgName"
          Copy-Item LICENSE "publish/$pkgName/LICENSE"
          Copy-Item README.md "publish/$pkgName/README.md"
          Copy-Item README.ja.md "publish/$pkgName/README.ja.md"
          Compress-Archive -Path "publish/$pkgName/*" -DestinationPath "publish/$zipName"
          $hash = (Get-FileHash "publish/$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -Encoding ascii publish/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/WslMountDrive-${{ github.ref_name }}-win-x64.zip
            publish/SHA256SUMS.txt
          generate_release_notes: true
