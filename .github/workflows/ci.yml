name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore WslMountDrive.sln

      - name: Build (Release)
        run: dotnet build WslMountDrive.sln -c Release --no-restore

      - name: Run unit tests (Release)
        run: dotnet test WslMountDrive.sln -c Release --no-build --verbosity normal

      - name: Check vulnerable NuGet packages
        shell: pwsh
        run: |
          $out = dotnet list WslMountDrive.sln package --vulnerable --include-transitive | Out-String
          Write-Host $out
          if ($out -match '(?i)\b(High|Critical)\b') {
            Write-Error "High or Critical NuGet vulnerabilities detected."
            exit 1
          }
